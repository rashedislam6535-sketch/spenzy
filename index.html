<style>

.setting-card{padding:14px}.setting-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row>div:first-child{flex:1}.setting-row b{font-size:12px}.setting-row small{font-size:9px;color:var(--muted);display:block;margin-top:2px}.btn{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);font-weight:800;font-size:11px}.btn.primary{background:linear-gradient(145deg,#ff685f,#ed5047);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 6px 16px rgba(237,80,71,.3)}.btn.green{background:linear-gradient(145deg,#3ed496,#10b981);color:#fff}.btn.danger{color:var(--red)}.full{width:100%}

witch.on{background:#ed5047}.switch.on i{transform:translateX(19px)}
.toast{position:fixed;z-index:130;left:50%;bottom:calc(95px + var(--safe-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(30,30,20,.95);color:#fff;padding:9px 15px;border-radius:14px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.3);transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.chat{height:330px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}.msg{max-width:84%;padding:10px 12px;border-radius:16px;font-size:11px;line-height:1.45}.msg.user{align-self:flex-end;background:#ed5047;color:#fff;border-bottom-right-radius:5px}.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}.receipt-preview{max-width:100%;max-height:220px;border-radius:18px;object-fit:contain;border:1px solid var(--line);display:none}
.cat-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;color:inherit}
.cat-chip.active{background:linear-gradient(145deg,#ff685f,#ed5047);color:#fff;border-color:#ed5047;box-shadow:0 4px 12px rgba(237,80,71,.35)}
.calc-badge{font-size:12px;font-weight:900;color:var(--green);background:rgba(16,185,129,.12);padding:3px 8px;border-radius:8px;border:1px solid rgba(16,185,129,.25)}
.calc-equal-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--red);color:#fff;border:none;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:900;cursor:pointer}
.scan-viewfinder{position:relative;width:100%;max-height:220px;border-radius:16px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--line)}
.scan-viewfinder img{width:100%;max-height:220px;object-fit:contain}
.scan-laser{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ed5047,#ff857d,#ed5047,transparent);box-shadow:0 0 12px #ed5047;animation:laserMove 1.5s infinite ease-in-out!important}
@keyframes laserMove{0%{top:4%}50%{top:94%}100%{top:4%}}
@media(max-width:520px){.glass,.topbar,.bottomnav{backdrop-filter:blur(12px) saturate(135%);-webkit-backdrop-filter:blur(12px) saturate(135%)}.primary-actions{grid-template-columns:1fr 1fr;gap:8px}.prime-action{padding:11px 10px;border-radius:17px}.prime-icon{width:38px;height:38px;font-size:18px}.hero-balance-val{font-size:30px}.smart-grid{grid-template-columns:1fr 1fr}.form.two{grid-template-columns:1fr}.content{padding-left:12px;padding-right:12px}}
@media(min-width:761px){.modal{justify-content:center}.sheet{margin-top:0;border-radius:26px;margin-bottom:22px}.sheet-head{border-radius:26px 26px 0 0}.bottomnav{bottom:18px}}

/* ===== Keyboard stability and rock-solid mobile positioning ===== */
html,body{scroll-behavior:auto!important}
@media(max-width:900px){
  .topbar,.glass,.glass-btn,.bottomnav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .modal{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(6,16,31,.35)!important}
  .topbar{background:color-mix(in srgb,var(--bg) 96%,white 4%)!important}
  .bottomnav{background:color-mix(in srgb,var(--card) 96%,var(--bg) 4%)!important;box-shadow:0 10px 28px rgba(237,80,71,.12)!important}
  .glass{box-shadow:0 8px 26px rgba(237,80,71,.08),inset 0 1px 0 rgba(255,255,255,.65)!important}
  html.dark .glass{box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)!important}
  html.keyboard-open:not(.in-modal) .bottomnav{display:none!important}
}

@media(max-width:900px){
  .prime-action,.row-icon,.hero-pill,.today-card,.smart-card,.search{box-shadow:none!important}
  body{background:linear-gradient(160deg,var(--bg),var(--bg2))!important}
}

<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="brand-cube"><img src="spenzy-icon.png" alt="Spenzy"></div><div><b>Spenzy</b><small id="headerSub">Your life & money, together.</small></div></div>
  <div class="top-actions"><button class="glass-btn" onclick="openUniversalSearch()">⌕</button><button class="glass-btn primary" onclick="openAI()">✦</button><button class="glass-btn" onclick="toggleTheme()">◐</button></div>
</header>
<main class="content">
<section id="home" class="page active"></section>
<section id="activity" class="page"></section>
<section id="smart" class="page"></section>
<section id="calendar" class="page"></section>
<section id="account" class="page"></section>
</main>
</div>
<nav class="bottomnav">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="activity"><span>▥</span>Activity</button>
<button data-page="smart"><span>✦</span>Smart</button>
<button data-page="calendar"><span>▦</span>Calendar</button>
<button data-page="account"><span>◉</span>Account</button>
</nav>
<div id="modalRoot"></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='spenzy_ultimate_v2';
const AI_PROVIDERS={
  gemini:{label:'Google Gemini (Free & Fast)',model:'gemini-1.5-flash',endpoint:'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',kind:'gemini'},
  groq:{label:'Groq (Free & Ultra Fast)',model:'llama-3.2-11b-vision-preview',endpoint:'https://api.groq.com/openai/v1/chat/completions',kind:'openai'},
  openai:{label:'OpenAI (GPT-4o mini)',model:'gpt-4o-mini',endpoint:'https://api.openai.com/v1/chat/completions',kind:'openai'},
  anthropic:{label:'Anthropic (Claude 3.5 Haiku)',model:'claude-3-5-haiku-20241022',endpoint:'https://api.anthropic.com/v1/messages',kind:'anthropic'},
  openrouter:{label:'OpenRouter',model:'openai/gpt-4o-mini',endpoint:'https://openrouter.ai/api/v1/chat/completions',kind:'openai'},
  deepseek:{label:'DeepSeek',model:'deepseek-chat',endpoint:'https://api.deepseek.com/chat/completions',kind:'openai'},
  xai:{label:'xAI (Grok)',model:'grok-3-mini',endpoint:'https://api.x.ai/v1/chat/completions',kind:'openai'}
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultState=()=>({profile:{name:'',age:'',occupation:'',income:0,budget:0,emergencyFund:0,debt:0,risk:'Balanced'},settings:{theme:'light',language:'en',notifications:true,roundup:false,roundupStep:10,aiKey:'',aiProvider:'auto',aiModel:'',rememberKey:true},wallets:[],transactions:[],bills:[],goals:[],dues:[],routines:[],habits:[],daily:{},notes:[],reminders:[],wishlist:[],recurring:[],roundupSaved:0,chat:[],markers:[],categoryBudgets:{},receiptDraft:null});
let S=load(),activePage='home',activityFilter='all',searchQuery='',calDate=new Date();
function load(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return defaultState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
function walletBalance(id){const w=S.wallets.find(x=>x.id===id);if(!w)return 0;let b=Number(w.opening||0);S.transactions.forEach(t=>{if(t.walletId!==id)return;if(t.type==='income')b+=+t.amount;if(['expense','saving','goal','lent','borrowed-reserve'].includes(t.type))b-=+t.amount;if(t.type==='due-return')b+=+t.amount});return b}
function totalWallets(){return S.wallets.reduce((a,w)=>a+walletBalance(w.id),0)}
function monthTx(){const m=today().slice(0,7);return S.transactions.filter(x=>String(x.date||'').startsWith(m))}
function monthSum(type){return monthTx().filter(x=>x.type===type).reduce((a,x)=>a+(+x.amount||0),0)}

function evalMathExpression(raw) {
  if (typeof raw === 'number') return raw;
  let str = String(raw || '').trim();
  if (!str) return 0;
  str = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  str = str.replace(/[\+\-\*\/]+$/, '').trim();
  if (!str) return 0;
  if (!/^[0-9\.\+\-\*\/\(\)\s]+$/.test(str)) {
    const num = parseFloat(str.replace(/[^0-9.]/g, ''));
    return isNaN(num) ? 0 : num;
  }
  try {
    const res = Function('"use strict"; return (' + str + ')')();
    if (typeof res === 'number' && !isNaN(res) && isFinite(res)) {
      return Math.round(res * 100) / 100;
    }
  } catch (e) {}
  return null;
}

function onAmountInput(val) {
  const hasOp = /[\+\-\*\/]/.test(val);
  const badge = $('#calcBadge');
  const eqBtn = $('#calcEqBtn');
  if (!hasOp) {
    if (badge?.style) badge.style.display = 'none';
    if (eqBtn?.style) eqBtn.style.display = 'none';
    return;
  }
  const computed = evalMathExpression(val);
  if (computed !== null && computed >= 0) {
    if (badge) {
      badge.textContent = `= ৳${computed}`;
      if (badge.style) badge.style.display = 'inline-block';
    }
    if (eqBtn?.style) eqBtn.style.display = 'block';
  } else {
    if (badge?.style) badge.style.display = 'none';
    if (eqBtn?.style) eqBtn.style.display = 'none';
  }
}

function resolveAmountCalc() {
  const inp = $('#mAmount');
  if (!inp) return;
  const val = String(inp.value || '').trim();
  if (/[\+\-\*\/]/.test(val)) {
    const computed = evalMathExpression(val);
    if (computed !== null && computed >= 0) {
      inp.value = computed;
    }
  }
  const badge = $('#calcBadge');
  if (badge?.style) badge.style.display = 'none';
  const eqBtn = $('#calcEqBtn');
  if (eqBtn?.style) eqBtn.style.display = 'none';
}

function appendMath(op) {
  const inp = $('#mAmount');
  if (!inp) return;
  let cur = inp.value.trim();
  if (op.startsWith('+') && !isNaN(+op)) {
    if (!cur || cur === '0') cur = op.slice(1);
    else cur = cur + op;
  } else {
    if (!cur) cur = '0';
    cur = cur.replace(/[\+\-\*\/]+$/, '') + op;
  }
  inp.value = cur;
  onAmountInput(cur);
  inp.focus();
}

function saveMoney(type){
  resolveAmountCalc();
  const raw = $('#mAmount')?.value;
  const amount = evalMathExpression(raw) || +raw;
  if(!(amount>0))return toast('Enter an amount');
  const wid=$('#mWallet')?.value||primaryWalletId();
  const cat=$('#mCategory')?.value.trim()||autoCategory($('#mNote')?.value.trim())||type;
  const t={id:uid(),type,amount,date:$('#mDate')?.value||today(),category:cat,walletId:wid,note:$('#mNote')?.value.trim()||'',createdAt:new Date().toISOString()};
  S.transactions.push(t);
  if(type==='expense'&&S.settings.roundup){
    const step=+S.settings.roundupStep||10,ru=(step-(amount%step))%step;
    if(ru){
      S.roundupSaved+=ru;
      S.transactions.push({id:uid(),type:'saving',amount:ru,date:t.date,category:'Round-up',walletId:wid,note:'Automatic round-up',createdAt:new Date().toISOString()});
    }
  }
  save();
  closeModal();
  render();
  toast(`${type==='expense'?'Expense':type==='income'?'Income':'Savings'} of ${money(amount)} saved`);
}

let focusTimer=null,focusLeft=25*60;function openFocus(){modal('Focus timer',`<div style="font-size:50px;font-weight:900;text-align:center;padding:24px" id="focusDisplay">25:00</div><div class="chiprow" style="justify-content:center"><button class="chip" onclick="setFocus(15)">15m</button><button class="chip active" onclick="setFocus(25)">25m</button><button class="chip" onclick="setFocus(50)">50m</button></div>`,`<div class="sheet-actions"><button class="btn primary" id="focusBtn" onclick="toggleFocus()">Start</button><button class="btn green" onclick="logFocusNow()">Log completed</button></div>`)}function setFocus(m){focusLeft=m*60;if($('#focusDisplay'))$('#focusDisplay').textContent=`${String(m).padStart(2,'0')}:00`}function toggleFocus(){if(focusTimer){clearInterval(focusTimer);focusTimer=null;$('#focusBtn').textContent='Start';return}focusTimer=setInterval(()=>{focusLeft=Math.max(0,focusLeft-1);const m=Math.floor(focusLeft/60),s=focusLeft%60;if($('#focusDisplay'))$('#focusDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(!focusLeft){clearInterval(focusTimer);focusTimer=null;toast('Focus session complete')}},1000);$('#focusBtn').textContent='Pause'}function logFocusNow(){const mins=Math.max(1,Math.round((25*60-focusLeft)/60)||25);S.daily[today()]||={};S.daily[today()].focus=(+S.daily[today()].focus||0)+mins;save();closeModal();render();toast(`${mins}m focus logged`)}

function compressImage(file, maxDimension = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function triggerScanReceipt(){
  let fi=$('#quickScanFileInput');
  if(!fi){
    fi=document.createElement('input');
    fi.id='quickScanFileInput';
    fi.type='file';
    fi.accept='image/*';
    fi.setAttribute('capture','environment');
    fi.style.display='none';
    document.body.appendChild(fi);
  }
  fi.onchange=async ()=>{
    const f=fi.files?.[0];
    if(!f)return;
    try {
      const compressed = await compressImage(f, 1200, 0.82);
      processScannedReceipt(compressed);
    } catch(err) {
      const r=new FileReader();
      r.onload=()=>processScannedReceipt(r.result);
      r.readAsDataURL(f);
    }
    fi.value='';
  };
  fi.click();
}

function parseReceiptText(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let category='Other', note='';
  const full=String(text||'').toLowerCase();

  if(/(pharma|medicine|tablet|capsule|syrup|hospital|clinic|doctor|drug|rx|\bmg\b|dispensary|square|incepta|beximco|lazz)/i.test(full)){
    category='Medicine';
  } else if(/(bus|ticket|uber|pathao|cng|fare|fuel|petrol|diesel|gas|transport|ride|toll|shohagh|green line|ena)/i.test(full)){
    category='Transport';
  } else if(/(restaurant|cafe|burger|pizza|kitchen|dining|food|coffee|tea|baker|shawarma|grill|biryani|kacchi)/i.test(full)){
    category='Food';
  } else if(/(grocery|supermarket|mart|bazar|bazaar|rice|oil|salt|dal|store|market|shwapno|meenaclick|unimart)/i.test(full)){
    category='Groceries';
  } else if(/(electric|wasa|desco|dpdc|nesco|wifi|internet|utility|water bill|gas bill|recharge)/i.test(full)){
    category='Utilities';
  } else if(/(cloth|shirt|shoe|wear|fashion|pant|dress|shop|apex|bata|aarong)/i.test(full)){
    category='Shopping';
  }

  for(const line of lines.slice(0,4)){
    if(line.length>2 && !/^\d+$/.test(line) && !/(receipt|invoice|bill|cash memo|tax|vat|welcome|token|date|time)/i.test(line)){
      note=line.slice(0,35);
      break;
    }
  }

  let foundAmount=0;
  for(let i=lines.length-1; i>=0; i--){
    const l=lines[i];
    if(/(total|net|payable|amount|subtotal|due|paid|bdt|tk|৳)/i.test(l)){
      const match=l.match(/(?:(?:total|net|payable|amount|bdt|tk|৳)[\s:=]*)([0-9,]+(?:\.[0-9]{1,2})?)/i)
               || l.match(/([0-9,]+(?:\.[0-9]{1,2})?)(?:\s*(?:bdt|tk|৳|\/-)?)$/i);
      if(match){
        const val=parseFloat(match[1].replace(/,/g,''));
        if(val>0){ foundAmount=val; break; }
      }
    }
  }

  if(!foundAmount){
    const allNums=[];
    for(const l of lines){
      const matches=l.matchAll(/\b([0-9]{1,6}(?:\.[0-9]{1,2})?)\b/g);
      for(const m of matches){
        const val=parseFloat(m[1]);
        if(val>=5 && val<=1000000 && !/^(19|20)\d\d$/.test(m[1])){
          allNums.push(val);
        }
      }
    }
    if(allNums.length) foundAmount=Math.max(...allNums);
  }

  return { amount: foundAmount, category, note: note || (category+' receipt') };
}

async function processScannedReceipt(dataUrl){
  S.receiptDraft=dataUrl;
  save();

  const hasKey = !!S.settings.aiKey;
  const provInfo = detectProviderFromKey(S.settings.aiKey);

  modal('Scanning Receipt',`
    <div class="scan-viewfinder">
      <img src="${dataUrl}" id="scanTargetImg" alt="Receipt">
      <div class="scan-laser"></div>
    </div>
    <div id="scanStatusMsg" style="font-weight:800;color:var(--red);text-align:center;padding:6px 10px;font-size:12px">
      ${hasKey ? `🔍 Analyzing with ${provInfo.label || 'Spenzy AI'}…` : '🔍 Reading receipt with local OCR…'}
    </div>
    ${!hasKey ? `
      <div style="background:rgba(237,80,71,.08);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="font-size:10px;color:var(--muted);line-height:1.4">
          <b style="color:var(--text);display:block">Want 1-second AI accuracy?</b>
          Add a free Google Gemini or Groq API key.
        </div>
        <button type="button" class="btn primary" onclick="closeModal();openAISettings()" style="padding:7px 12px;font-size:10px;white-space:nowrap">Set API key</button>
      </div>
    ` : ''}
  `,`<div class="sheet-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${hasKey ? '<button type="button" class="btn" onclick="closeModal();openAISettings()">API Settings</button>' : ''}</div>`);

  const setStatus=(msg)=>{ if($('#scanStatusMsg')) $('#scanStatusMsg').textContent=msg; };

  // Tier 1: If AI API key is configured, use AI vision
  if(S.settings.aiKey){
    try{
      setStatus(`Analyzing receipt with ${provInfo.label || 'Spenzy AI'}…`);
      const prompt='You are an expert receipt OCR assistant. Look at this receipt image carefully. Extract:\n1. Total or payable amount as a number (e.g. 250 or 15.50).\n2. Category strictly one of: Transport, Medicine, Food, Groceries, Shopping, Utilities, Education, Entertainment, Personal, Other.\n3. Merchant name or brief description for note.\nReturn STRICT JSON ONLY without markdown fences: {"amount":number,"category":"string","note":"string"}';
      const raw=await aiRequest(prompt, dataUrl);
      const m=String(raw).match(/\{[\s\S]*?\}/);
      const j=JSON.parse(m?m[0]:raw);
      const amt=Number(j?.amount);
      if(amt > 0){
        closeModal();
        openMoney('expense',{ amount: amt, category: j.category||'Other', note: j.note||'Scanned receipt' });
        toast(`✓ Scanned: ${money(amt)} · ${j.category||'Expense'}`);
        return;
      }
    }catch(e){
      console.warn('AI vision scan failed, falling back to OCR:', e);
      setStatus(`AI: ${e.message || 'Failed'}. Reading locally…`);
    }
  }

  // Tier 2: Browser on-device / OCR engine
  try{
    setStatus('Detecting text and amount…');
    let extractedText='';

    if('TextDetector' in window){
      try{
        const detector=new window.TextDetector();
        const img=document.getElementById('scanTargetImg')||new Image();
        if(!img.complete) await new Promise(r=>img.onload=r);
        const results=await detector.detect(img);
        extractedText=results.map(r=>r.rawValue).join('\n');
      }catch(err){
        console.warn('TextDetector failed:', err);
      }
    }

    if(!extractedText && typeof window.Tesseract==='undefined'){
      setStatus('Loading local text recognizer…');
      try{
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          s.onload=resolve;
          s.onerror=reject;
          document.head.appendChild(s);
        });
      }catch(e){}
    }

    if(!extractedText && typeof window.Tesseract!=='undefined'){
      setStatus('Recognizing receipt numbers…');
      const res=await window.Tesseract.recognize(dataUrl,'eng');
      extractedText=res?.data?.text||'';
    }

    if(extractedText){
      const parsed=parseReceiptText(extractedText);
      if(parsed.amount>0){
        closeModal();
        openMoney('expense', parsed);
        toast(`✓ Scanned: ${money(parsed.amount)} · ${parsed.category}`);
        return;
      }
    }
  }catch(e){
    console.warn('OCR error:', e);
  }

  // Tier 3: Fallback if no exact number could be auto-extracted
  setStatus('Receipt captured! Please enter the amount to complete expense:');
  modal('Receipt Captured',`
    <div class="scan-viewfinder" style="max-height:160px">
      <img src="${dataUrl}" alt="Receipt">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label style="font-size:11px;font-weight:800;text-transform:uppercase">Amount (৳)</label>
      <input id="fastAmount" type="text" inputmode="decimal" placeholder="0 or 10+5+6+20" style="font-size:24px;font-weight:900;padding:12px;color:var(--red)">
    </div>
    <div class="field">
      <label>Category</label>
      <div class="cat-chips">
        ${CATEGORIES.expense.map(c=>`
          <button type="button" class="cat-chip" onclick="$('#fastCat').value='${c.name}'"><span>${c.icon}</span> ${c.name}</button>
        `).join('')}
      </div>
      <input id="fastCat" list="catDatalist" value="Food" placeholder="Category" style="margin-top:6px">
    </div>
  `,`<div class="sheet-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn primary" onclick="confirmFastReceipt()">Save Expense</button></div>`);
}

function detectProviderFromKey(key){const k=String(key||'').trim();if(!k)return{id:'',label:'Not configured',confidence:''};if(k.startsWith('sk-ant-'))return{id:'anthropic',label:'Anthropic (Claude)',confidence:'high'};if(k.startsWith('AIza'))return{id:'gemini',label:'Google Gemini',confidence:'high'};if(k.startsWith('gsk_'))return{id:'groq',label:'Groq (Llama 3.2 Vision)',confidence:'high'};if(k.startsWith('sk-or-v1-'))return{id:'openrouter',label:'OpenRouter',confidence:'high'};if(k.startsWith('xai-'))return{id:'xai',label:'xAI (Grok)',confidence:'high'};if(k.startsWith('sk-proj-')||k.startsWith('sk-svcacct-')||k.startsWith('sk-admin-'))return{id:'openai',label:'OpenAI (GPT-4o mini)',confidence:'high'};if(k.startsWith('sk-'))return{id:'openai',label:'OpenAI-style key',confidence:'low'};return{id:'',label:'Unknown key pattern',confidence:''}}
function detectProvider(){if(S.settings.aiProvider&&S.settings.aiProvider!=='auto')return S.settings.aiProvider;return detectProviderFromKey(S.settings.aiKey).id||'offline'}
function providerCfg(){return AI_PROVIDERS[detectProvider()]||null}
function openAISettings(){const d=detectProviderFromKey(S.settings.aiKey);modal('AI & Scanner settings',`<div class="form"><div class="field"><label>API key</label><input id="aiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.settings.aiKey)}" placeholder="Paste Gemini (AIza...), Groq (gsk_...) or OpenAI key" oninput="updateAiDetectionUI()"></div><div class="field"><label>Detected provider</label><input id="aiDetected" value="${esc(d.label)}" readonly style="font-weight:800;color:var(--red)"></div><div class="field"><label>Provider override</label><select id="aiProvider" onchange="updateAiDetectionUI(true)"><option value="auto" ${S.settings.aiProvider==='auto'?'selected':''}>Auto detect (Recommended)</option>${Object.entries(AI_PROVIDERS).map(([id,c])=>`<option value="${id}" ${S.settings.aiProvider===id?'selected':''}>${c.label}</option>`).join('')}</select></div><div class="field"><label>Model (optional)</label><input id="aiModel" value="${esc(S.settings.aiModel)}" placeholder="Auto default"></div><div id="aiStatus" class="empty" style="padding:8px 4px;text-align:left">${d.id?esc(d.label+' detected. Tap Detect & test connection below.'):'💡 Get a 100% free API key from Google AI Studio (aistudio.google.com) or Groq (console.groq.com) for instant receipt scanning.'}</div></div><div class="empty">Keys are saved locally on this device. Google Gemini and Groq work best with receipt image scanning.</div>`,`<div class="sheet-actions"><button type="button" class="btn" onclick="testAI()">Detect & test</button><button type="button" class="btn primary" onclick="saveAISettings()">Save</button></div>`);updateAiDetectionUI()}
function updateAiDetectionUI(providerChanged=false){const key=$('#aiKey')?.value.trim()||'',d=detectProviderFromKey(key),override=$('#aiProvider')?.value||'auto',id=override==='auto'?d.id:override,cfg=AI_PROVIDERS[id];if($('#aiDetected'))$('#aiDetected').value=d.label;if($('#aiModel')&&providerChanged)$('#aiModel').value='';if($('#aiModel'))$('#aiModel').placeholder=cfg?`Default: ${cfg.model}`:'Auto default';const st=$('#aiStatus');if(st){if(!key)st.textContent='💡 Get a free API key from Google AI Studio (aistudio.google.com) or Groq (console.groq.com).';else if(override!=='auto')st.textContent=`Using ${cfg?.label||override} by manual selection.`;else if(d.id)st.textContent=`${d.label} key detected locally.`;else st.textContent='Unknown key pattern. Choose the provider manually.'}}
function syncAISettingsFromForm(){if(!$('#aiKey'))return;S.settings.aiProvider=$('#aiProvider').value||'auto';S.settings.aiKey=$('#aiKey').value.trim();S.settings.aiModel=$('#aiModel').value.trim();save()}
function saveAISettings(){syncAISettingsFromForm();closeModal();render();toast('AI settings saved')}
async function testAI(){syncAISettingsFromForm();const st=$('#aiStatus');if(st)st.textContent='Testing connection…';try{const out=await aiRequest('Reply with exactly: Connected');if(st)st.textContent=`Connected · ${AI_PROVIDERS[detectProvider()]?.label||detectProvider()}${out?' · '+String(out).trim().slice(0,40):''}`;toast('AI connected')}catch(e){if(st)st.textContent=e.message||'AI connection failed';toast('AI test failed')}}
async function aiRequest(prompt,imageData){const provider=detectProvider(),key=String(S.settings.aiKey||'').trim(),cfg=providerCfg();if(!key)throw Error('Add an API key in AI settings first');if(!cfg)throw Error('Provider could not be detected. Choose it manually in AI settings.');let model=S.settings.aiModel||cfg.model;if(provider==='groq'&&imageData&&!S.settings.aiModel)model='llama-3.2-11b-vision-preview';if(provider==='openai'&&(!S.settings.aiModel||S.settings.aiModel==='gpt-5.6-luna'))model='gpt-4o-mini';if(provider==='gemini'&&(!S.settings.aiModel||S.settings.aiModel==='gemini-2.5-flash'))model='gemini-1.5-flash';const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);try{let r,data;if(cfg.kind==='responses'){let input=prompt;if(imageData)input=[{role:'user',content:[{type:'input_text',text:prompt},{type:'input_image',image_url:imageData}]}];r=await fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,input,max_output_tokens:700}),signal:ctrl.signal,cache:'no-store'});data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data?.error?.message||`OpenAI request failed (${r.status})`);return String(data.output_text||data.output?.flatMap(o=>o.content||[]).map(c=>c.text||'').join('')||'').trim()}if(cfg.kind==='openai'){const content=imageData?[{type:'text',text:prompt},{type:'image_url',image_url:{url:imageData}}]:prompt,headers={'Content-Type':'application/json','Authorization':'Bearer '+key};if(provider==='openrouter'){headers['HTTP-Referer']='https://spenzy.local';headers['X-Title']='Spenzy'}r=await fetch(cfg.endpoint,{method:'POST',headers,body:JSON.stringify({model,messages:[{role:'user',content}],temperature:.15,max_tokens:700}),signal:ctrl.signal,cache:'no-store'});data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data?.error?.message||`AI request failed (${r.status})`);return String(data?.choices?.[0]?.message?.content||'').trim()}if(cfg.kind==='anthropic'){const content=imageData?[{type:'image',source:{type:'base64',media_type:(imageData.match(/^data:([^;]+)/)||[])[1]||'image/jpeg',data:imageData.split(',')[1]}},{type:'text',text:prompt}]:prompt;r=await fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:700,messages:[{role:'user',content}]}),signal:ctrl.signal,cache:'no-store'});data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data?.error?.message||`Anthropic request failed (${r.status})`);return String((data?.content||[]).map(x=>x.text||'').join('\n')).trim()}if(cfg.kind==='gemini'){const parts=[{text:prompt}];if(imageData){const [meta,b64]=imageData.split(',');parts.push({inline_data:{mime_type:(meta.match(/data:(.*?);/)||[])[1]||'image/jpeg',data:b64}})}const url=cfg.endpoint.replace('{model}',encodeURIComponent(model));r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:.15,maxOutputTokens:700}}),signal:ctrl.signal,cache:'no-store'});data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data?.error?.message||`Gemini request failed (${r.status})`);return String(data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'').trim()}throw Error('Provider not supported')}catch(e){if(e?.name==='AbortError')throw Error('AI request timed out. Check your internet connection.');if(e instanceof TypeError)throw Error('Network/WebView blocked the AI request. Check internet permission and WebToApp network access.');throw e}finally{clearTimeout(timer)}}
function openAI(){modal('Spenzy AI',`<div class="chat" id="chatBox">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${esc(m.text)}</div>`).join(''):'<div class="empty">Ask about your money, habits, goals or recent activity.</div>'}</div><div class="field"><input id="chatInput" placeholder="Ask Spenzy AI..."></div>`,`<div class="sheet-actions"><button type="button" class="btn" onclick="openAISettings()">API settings</button><button type="button" class="btn primary" onclick="sendAI()">Send</button></div>`)}
async function sendAI(){const input=$('#chatInput'),q=input?.value.trim();if(!q)return;input.blur();document.documentElement.classList.remove('keyboard-open','in-modal');S.chat.push({role:'user',text:q});save();if(!S.settings.aiKey){S.chat.push({role:'ai',text:'Add an API key in AI settings to use live Spenzy AI. Your local data remains on this device.'});save();openAI();return}const context={profile:S.profile,month:{income:monthSum('income'),spent:monthExpenses(),saved:monthSum('saving')+monthSum('goal')},walletBalance:totalWallets(),goals:S.goals.map(g=>({name:g.name,target:g.target,current:g.current})),dues:S.dues.filter(d=>d.status==='open'),today:S.daily[today()]||{}};try{const a=await aiRequest(`You are Spenzy AI, a concise personal life and finance assistant. Use only supplied data for personalized claims. User data: ${JSON.stringify(context)}\nQuestion: ${q}`);S.chat.push({role:'ai',text:a||'No response'});save();openAI()}catch(e){S.chat.push({role:'ai',text:'AI error: '+(e.message||'Could not reach provider')});save();openAI()}}
function openBackup(){modal('Backup & data',`<div class="setting-card glass"><div class="setting-row"><div><b>Export JSON backup</b><small>Complete local Spenzy data</small></div><button class="btn" onclick="exportJSON()">Export</button></div><div class="setting-row"><div><b>Export transactions CSV</b><small>Money activity for spreadsheets</small></div><button class="btn" onclick="exportCSV()">Export</button></div><div class="setting-row"><div><b>Import backup</b><small>Restore a Spenzy JSON backup</small></div><button class="btn" onclick="$('#importFile').click()">Import</button></div><div class="setting-row"><div><b>Import transactions CSV</b><small>Date, Type, Amount, Category, Wallet, Note</small></div><button class="btn" onclick="$('#importCsv').click()">Import</button></div><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importJSON(this.files[0])"><input id="importCsv" type="file" accept=".csv,text/csv" class="hidden" onchange="importCSV(this.files[0])"></div>`)}function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function exportJSON(){download('Spenzy-backup.json',new Blob([JSON.stringify(S,null,2)],{type:'application/json'}))}function exportCSV(){const rows=[['Date','Type','Amount','Category','Wallet','Note'],...S.transactions.map(t=>[t.date,t.type,t.amount,t.category,walletName(t.walletId),t.note])];download('Spenzy-transactions.csv',new Blob([rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}))}function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);S={...defaultState(),...x};save();closeModal();render();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f)}
function importCSV(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const lines=String(r.result).split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error();const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};const head=parse(lines[0]).map(x=>x.toLowerCase().trim());let added=0;for(const line of lines.slice(1)){const a=parse(line);const getc=n=>a[head.indexOf(n)]||'';const amount=+getc('amount');if(!(amount>0))continue;const walletLabel=getc('wallet');let wid=S.wallets.find(w=>w.name.toLowerCase()===walletLabel.toLowerCase())?.id||'';S.transactions.push({id:uid(),date:getc('date')||today(),type:getc('type')||'expense',amount,category:getc('category')||'Imported',walletId:wid,note:getc('note')||'',createdAt:new Date().toISOString()});added++}save();closeModal();render();toast(`${added} transactions imported`)}catch{toast('Could not import CSV')}};r.readAsText(f)}
function toggleLanguage(){S.settings.language=S.settings.language==='en'?'bn':'en';save();render();toast(S.settings.language==='bn'?'বাংলা চালু হয়েছে':'English enabled')}function applyLanguage(){if(S.settings.language!=='bn')return;const map={Home:'হোম',Activity:'অ্যাক্টিভিটি',Smart:'স্মার্ট',Calendar:'ক্যালেন্ডার',Account:'অ্যাকাউন্ট'};$$('.bottomnav button').forEach(b=>{const txt=[...b.childNodes].find(n=>n.nodeType===3);if(txt&&map[txt.textContent.trim()])txt.textContent=map[txt.textContent.trim()]})}
function toggleTheme(){S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme()}function applyTheme(){document.documentElement.classList.toggle('dark',S.settings.theme==='dark');document.querySelector('meta[name=theme-color]').content=S.settings.theme==='dark'?'#121316':'#ed5047'}
function resetAll(){if(!confirm('Erase all Spenzy data on this device?'))return;localStorage.removeItem(KEY);S=defaultState();save();render();toast('Data reset')}
function shiftCal(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}function openDay(ds){const tx=S.transactions.filter(t=>t.date===ds),notes=S.notes.filter(n=>n.date===ds);modal(ds,`<div class="list">${tx.length?tx.map(txRow).join(''):''}${notes.map(n=>`<div class="row-item"><div class="row-icon">✎</div><div class="row-copy"><b>${esc(n.text)}</b><small>Note</small></div></div>`).join('')}${!tx.length&&!notes.length?'<div class="empty">Nothing logged on this date.</div>':''}</div><div class="field" style="margin-top:10px"><label>Day marker</label><input id="markerText" value="${esc(S.markers.find(x=>x.date===ds)?.label||'')}" placeholder="Exam, Salary, Trip..."></div>`,`<div class="sheet-actions"><button class="btn primary" onclick="saveMarker('${ds}')">Save marker</button></div>`)}function saveMarker(ds){const t=$('#markerText').value.trim();S.markers=S.markers.filter(x=>x.date!==ds);if(t)S.markers.push({date:ds,label:t});save();closeModal();renderCalendar()}
function openUniversalSearch(){modal('Search Spenzy',`<div class="field"><input id="uSearch" placeholder="Search transactions, goals, bills, notes..."></div><div id="uResults" class="list" style="margin-top:10px"><div class="empty">Start typing to search your local data.</div></div>`);setTimeout(()=>$('#uSearch').oninput=e=>renderUSearch(e.target.value),30)}function renderUSearch(q){q=q.trim().toLowerCase();const out=$('#uResults');if(!q){out.innerHTML='<div class="empty">Start typing to search your local data.</div>';return}const items=[];S.transactions.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,8).forEach(x=>items.push(txRow(x)));S.goals.filter(x=>x.name.toLowerCase().includes(q)).forEach(g=>items.push(`<div class="row-item"><div class="row-icon">◎</div><div class="row-copy"><b>${esc(g.name)}</b><small>Goal</small></div><div class="row-amount">${money(g.current)}</div></div>`));S.notes.filter(x=>x.text.toLowerCase().includes(q)).forEach(n=>items.push(`<div class="row-item"><div class="row-icon">✎</div><div class="row-copy"><b>${esc(n.text)}</b><small>Note · ${n.date}</small></div></div>`));out.innerHTML=items.join('')||'<div class="empty">No results.</div>'}

Object.assign(window,{updateAiDetectionUI,testAI,setPage,setActivityFilter,openMoney,openWallets,openBills,openGoals,openDues,prefillDue,openRoutines,openReceipt,openHabits,quickDaily,openFocus,openSleep,openPrayer,openScreen,openRemember,openWishlist,openNote,openRecurring,openAI,toggleTheme,toast,renderActivity,saveMoney,addWallet,deleteWallet,addBill,toggleBill,deleteBill,addGoal,contributeGoal,deleteGoal,addDue,settleDue,reopenDue,deleteDue,addRoutine,runRoutine,deleteRoutine,addHabit,toggleHabit,deleteHabit,setFocus,toggleFocus,logFocusNow,saveSleep,togglePrayer,saveScreen,addReminder,toggleReminder,deleteReminder,addWish,toggleWish,deleteWish,saveNote,addRecurring,deleteRecurring,previewReceipt,analyzeReceipt,applyBudgets,showAnomalies,showInvestment,toggleRoundup,openProfile,saveProfile,openAISettings,saveAISettings,sendAI,openBackup,exportJSON,exportCSV,importJSON,importCSV,toggleLanguage,resetAll,shiftCal,openDay,saveMarker,openUniversalSearch,closeModal,logLearned,primaryWalletId,totalWallets,walletBalance,getS:()=>S,triggerScanReceipt,processScannedReceipt,parseReceiptText,confirmFastReceipt,selectCategory,highlightMatchingChip,evalMathExpression,onAmountInput,resolveAmountCalc,appendMath,CATEGORIES,getCategoriesForType});
